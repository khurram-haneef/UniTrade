# Copy these values into Streamlit's Secrets manager. Never commit secrets.toml.
# Generate APP_ENCRYPTION_KEY with:
# python -c "from auth_store import generate_encryption_key; print(generate_encryption_key())"
APP_ENCRYPTION_KEY = "replace-with-a-fernet-key"

# Use a persistent, mounted volume path in every deployment. Do not leave this
# on an ephemeral Streamlit/container filesystem, or accounts and encrypted
# exchange credentials will be lost after a restart or redeploy.
UNITRADE_DB_PATH = "/persistent/unitrade/unitrade_users.db"

# Set this to false to allow immediate account creation when SMTP is unavailable.
# Set this to true only after all SMTP settings below have been verified.
REQUIRE_EMAIL_VERIFICATION = false

# SMTP sender credentials, configured only in Streamlit Secrets.
SMTP_HOST = "smtp.example.com"
SMTP_PORT = 587
SMTP_USERNAME = "smtp-username"
SMTP_PASSWORD = "smtp-password"
SMTP_SENDER = "UniTrade <no-reply@example.com>"
SMTP_USE_TLS = true
